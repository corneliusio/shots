<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Storage</title>
  </head>
  <body>
    <h1 id="storage">storage</h1>
    <pre id="cookies"></pre>
    <pre id="local"></pre>
    <script>
      // ?set=value writes localStorage and ?cookie=value writes a cookie
      // before reporting, so auth state capture and restore can be checked on
      // any origin.
      const params = new URLSearchParams(location.search);
      const set = params.get('set');
      if (set !== null) {
        localStorage.setItem('shots', set);
      }
      const cookie = params.get('cookie');
      if (cookie !== null) {
        document.cookie = 'shots_session=' + cookie + '; path=/';
      }
      document.getElementById('cookies').textContent = document.cookie;
      document.getElementById('local').textContent = localStorage.getItem('shots') ?? '';
      // ?then=URL continues to another loopback origin once this one is
      // written, the way a sign-in leaves an identity provider for the app.
      const then = params.get('then');
      if (then !== null && then.startsWith('http://127.0.0.1:')) {
        location.replace(then);
      }
    </script>
  </body>
</html>
