<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Storage</title>
  </head>
  <body>
    <h1 id="storage">storage</h1>
    <pre id="cookies"></pre>
    <pre id="local"></pre>
    <script>
      // ?set=value writes localStorage and ?cookie=value writes a cookie
      // before reporting, so auth state capture and restore can be checked on
      // any origin.
      const params = new URLSearchParams(location.search);
      const set = params.get('set');
      if (set !== null) {
        localStorage.setItem('shots', set);
      }
      const cookie = params.get('cookie');
      if (cookie !== null) {
        document.cookie = 'shots_session=' + cookie + '; path=/';
      }
      document.getElementById('cookies').textContent = document.cookie;
      document.getElementById('local').textContent = localStorage.getItem('shots') ?? '';
    </script>
  </body>
</html>
