<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixed overlap</title>
    <style>
      html, body { margin: 0; background: #ffffff; }
      body { height: 1800px; }
      header { position: fixed; inset: 0 0 auto; height: 120px; background: #ff0000; z-index: 10; }
      #sticky-overlay { position: sticky; top: 0; height: 80px; background: #ff8800; z-index: 9; }
      #target { position: absolute; left: 100px; top: 900px; width: 400px; height: 620px; background: #00ff00; }
      #selected-fixed-child { position: fixed; left: 150px; top: 160px; width: 50px; height: 50px; background: #0000ff; z-index: 20; }
      #non-overlapping-widget { position: fixed; right: 10px; bottom: 10px; width: 80px; height: 80px; background: #800080; }
    </style>
  </head>
  <body>
    <header></header>
    <div id="sticky-overlay"></div>
    <main id="target">
      <div id="selected-fixed-child"></div>
    </main>
    <div id="non-overlapping-widget"></div>
  </body>
</html>
