name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # Cross-compiling is enough: shots is pure Go, and the only platform-
      # specific code (process groups, job objects) is build-tagged, not cgo.
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="shots_${VERSION}_${os}_${arch}"
            bin="shots"
            if [ "$os" = windows ]; then bin="shots.exe"; fi
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X github.com/corneliusio/shots/internal/command.Version=${VERSION#v}" \
              -o "dist/$bin" ./cmd/shots
            if [ "$os" = windows ]; then
              (cd dist && zip -q "$name.zip" "$bin" && rm "$bin")
            else
              (cd dist && tar czf "$name.tar.gz" "$bin" && rm "$bin")
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes dist/*
